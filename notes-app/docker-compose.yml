services:

  # ── Laravel App (PHP-FPM) ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: notes_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - DB_HOST=db
      - DB_DATABASE=notes_db
      - DB_USERNAME=notes_user
      - DB_PASSWORD=Secret@123
      - REDIS_HOST=redis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=sync
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - notes_network

  # ── Nginx Web Server ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: notes_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - notes_network

  # ── MySQL Database ─────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: notes_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: notes_db
      MYSQL_USER: notes_user
      MYSQL_PASSWORD: Secret@123
      MYSQL_ROOT_PASSWORD: RootSecret@123
    ports:
      - "3307:3306"
    volumes:
      - notes_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootSecret@123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notes_network

  # ── Redis Cache ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: notes_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - notes_network

# ── Volumes ────────────────────────────────────────────────────
volumes:
  notes_db_data:
    driver: local

# ── Networks ───────────────────────────────────────────────────
networks:
  notes_network:
    driver: bridge
